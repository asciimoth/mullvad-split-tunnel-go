name: Test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - run: go mod verify
      - run: go mod tidy -diff
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -run '^$' -fuzz FuzzDriverDecoders -fuzztime 10s .
      - run: go test -run '^$' -fuzz FuzzConfigurationRoundTrip -fuzztime 10s .
      - run: go test -run '^$' -fuzz FuzzProcessEncoding -fuzztime 10s .
      - run: go test -run '^$' -fuzz FuzzDemoTunnelProtocol -fuzztime 10s ./internal/demotunnel
      - name: Install VM harness test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-utils shellcheck
      - run: dev/winvm/tests/host-scripts.sh

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: amd64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - name: Run shared Windows baseline
        shell: pwsh
        env:
          GO_EXPECTED_VERSION: 1.25.5
        run: ./dev/winvm/test.ps1 -ArtifactDir "$env:RUNNER_TEMP\native-unit-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-unit-${{ matrix.architecture }}
          path: ${{ runner.temp }}/native-unit-artifacts

  windows-live-driver:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            architecture: amd64
          - runner: windows-11-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: true
      - name: Run native signed-driver gate
        shell: pwsh
        run: ./dev/winvm/host-e2e.ps1 -ArtifactDir "$env:RUNNER_TEMP\live-driver-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-driver-${{ matrix.architecture }}
          path: ${{ runner.temp }}/live-driver-artifacts

  upstream-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mullvad/win-split-tunnel
          ref: 0a0eb97f67d1dbcb3d08bda66d3b24f465d95475
          path: upstream-driver
      - run: g++ -std=c++17 -Wall -Wextra -Werror -I tools/abi_compat -I upstream-driver/src tools/abi_fixture.cpp -o abi-fixture
      - run: ./abi-fixture > /tmp/abi.json
      - run: cmp testdata/abi.json /tmp/abi.json
